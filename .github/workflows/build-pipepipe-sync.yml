name: Build PipePipe Sync APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run PipePipeExtractor account sync tests
        run: |
          cd PipePipeExtractor
          chmod +x gradlew
          ./gradlew :extractor:test --tests org.schabi.newpipe.extractor.services.youtube.YoutubeAccountSyncTest --stacktrace

      - name: Build Debug APK
        run: |
          cd PipePipeClient
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: List built APKs
        run: ls -lh PipePipeClient/app/build/outputs/apk/debug/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: pipepipe-sync-arm64-apk
          path: PipePipeClient/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
